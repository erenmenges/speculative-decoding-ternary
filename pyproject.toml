[project]
name = "speculative-decoding-ternary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eren Menges", email = "erenmenges2@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
]

[project.scripts]
speculative-decoding-ternary = "speculative_decoding_ternary:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]
